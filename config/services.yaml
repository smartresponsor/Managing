services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Managing\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Value/'
      - '../src/ManagingBundle.php'

  App\Managing\Filter\Admin\ManageContributionFilter:
    arguments:
      $enabledComponents: '%managing.enabled_components%'
      $disabledResources: '%managing.disabled_resources%'
      $menuOrder: '%managing.menu_order%'

  App\Managing\Policy\Crud\ManageCrudBehaviorPolicy:
    arguments:
      $searchFields: '%managing.crud_behavior_search_fields%'
      $statusFields: '%managing.crud_behavior_status_fields%'
      $publicationFlagFields: '%managing.crud_behavior_publication_flag_fields%'
      $publicationDateFields: '%managing.crud_behavior_publication_date_fields%'
      $auditDateFields: '%managing.crud_behavior_audit_date_fields%'
      $defaultSortFields: '%managing.crud_behavior_default_sort_fields%'

  App\Managing\Policy\Crud\ManageCrudFieldTypeOverridePolicy:
    arguments:
      $fieldTypeOverrides: '%managing.crud_field_type_overrides%'

  App\Managing\Policy\Crud\ManageCrudFieldPolicy:
    arguments:
      $primaryIdentifierFields: '%managing.crud_field_primary_identifier_candidates%'
      $titleFields: '%managing.crud_field_title_candidates%'
      $identityFields: '%managing.crud_field_identity_candidates%'
      $descriptionFields: '%managing.crud_field_description_candidates%'
      $technicalExcludedFields: '%managing.crud_field_technical_excluded_fields%'
      $auditDateFields: '%managing.crud_behavior_audit_date_fields%'
      $emailKeywords: '%managing.crud_field_email_keywords%'
      $urlKeywords: '%managing.crud_field_url_keywords%'
      $longTextKeywords: '%managing.crud_field_long_text_keywords%'
      $fieldTypeOverrides: '%managing.crud_field_type_overrides%'
      $fieldTypeOverridePolicy: '@App\Managing\Policy\Crud\ManageCrudFieldTypeOverridePolicy'

  App\Managing\Resolver\Crud\ManageCrudConfiguredFieldUserProfileResolver:
    arguments:
      $fieldUserProfilesConfig: '%managing.crud_field_user_profiles%'

  App\Managing\Resolver\Crud\ManageCrudReaderFieldUserProfileResolver:
    arguments:
      $reader: '@App\Managing\ReaderInterface\Crud\ManageCrudFieldUserProfileReaderInterface'

  App\Managing\Resolver\Crud\ManageCrudRollingFieldExternalAccessResolver:
    arguments:
      $rollingFieldAccessDecisionService: null
      $permissionKey: '%managing.crud_field_external_access_permission_key%'
      $failureEffect: '%managing.crud_field_external_access_failure_effect%'

  App\Managing\Validator\Crud\ManageCrudFieldUserProfileStorageActivationValidator:
    arguments:
      $runtimeBackend: '%managing.crud_field_user_profile_runtime_backend%'
      $readerBackend: '%managing.crud_field_user_profile_reader_backend%'
      $writerBackend: '%managing.crud_field_user_profile_writer_backend%'
      $entityManagerService: '%managing.crud_field_user_profile_entity_manager_service%'
      $managerRegistry: '@?doctrine'

  App\Managing\ValidatorInterface\Crud\ManageCrudFieldUserProfileStorageActivationValidatorInterface:
    alias: App\Managing\Validator\Crud\ManageCrudFieldUserProfileStorageActivationValidator

  App\Managing\Reader\Crud\ManageCrudConfigShapeFieldUserProfileReader:
    arguments:
      $fieldUserProfilesConfig: '%managing.crud_field_user_profiles%'



  App\Managing\Writer\Crud\ManageCrudConfigShapeFieldUserProfileWriter:
    arguments:
      $fieldUserProfilesConfig: '%managing.crud_field_user_profiles%'

  App\Managing\Handler\Crud\ManageCrudFieldUserProfileApplyHandler:
    arguments:
      $writer: '@App\Managing\WriterInterface\Crud\ManageCrudFieldUserProfileWriterInterface'
      $reader: '@App\Managing\ReaderInterface\Crud\ManageCrudFieldUserProfileReaderInterface'


  App\Managing\Resolver\Crud\ManageCrudFieldVisibilityExplanationResolver:
    arguments:
      $fieldVisibilityConfig: '%managing.crud_field_visibility%'
      $externalAccessResolver: '@App\Managing\ResolverInterface\Crud\ManageCrudFieldExternalAccessResolverInterface'
      $userProfileResolver: '@App\Managing\ResolverInterface\Crud\ManageCrudFieldUserProfileResolverInterface'

  App\Managing\Resolver\Crud\ManageCrudFieldVisibilityResolver:
    arguments:
      $fieldVisibilityConfig: '%managing.crud_field_visibility%'
      $externalAccessResolver: '@App\Managing\ResolverInterface\Crud\ManageCrudFieldExternalAccessResolverInterface'
      $userProfileResolver: '@App\Managing\ResolverInterface\Crud\ManageCrudFieldUserProfileResolverInterface'

  App\Managing\Factory\Crud\ManageCrudFieldFactory:
    arguments:
      $fieldPolicy: '@App\Managing\Policy\Crud\ManageCrudFieldPolicy'
      $fieldDefinitionFactory: '@App\Managing\FactoryInterface\Crud\ManageCrudFieldDefinitionFactoryInterface'
      $fieldVisibilityResolver: '@App\Managing\ResolverInterface\Crud\ManageCrudFieldVisibilityResolverInterface'
      $fieldFromDefinitionFactory: '@App\Managing\FactoryInterface\Crud\ManageEasyAdminFieldFromDefinitionFactoryInterface'

  App\Managing\Scorer\Admin\ManageCrudResourceScorer:
    arguments:
      $primaryEntityBonusSuffixesByComponent: '%managing.crud_primary_entity_bonus_suffixes_by_component%'
      $primaryEntityPenaltySuffixesByComponent: '%managing.crud_primary_entity_penalty_suffixes_by_component%'
      $technicalKeywords: '%managing.crud_primary_technical_keywords%'
      $businessKeywords: '%managing.crud_primary_business_keywords%'

  App\Managing\Policy\Admin\ManageCrudResourcePolicy:
    arguments:
      $componentRootNames: '%managing.component_root_names%'
      $componentRootAliases: '%managing.component_root_aliases%'
      $includedEntitySuffixesByComponent: '%managing.host_scan_included_entity_suffixes_by_component%'
      $primaryEntityBonusSuffixesByComponent: '%managing.crud_primary_entity_bonus_suffixes_by_component%'
      $primaryEntityPenaltySuffixesByComponent: '%managing.crud_primary_entity_penalty_suffixes_by_component%'
      $technicalKeywords: '%managing.crud_primary_technical_keywords%'
      $businessKeywords: '%managing.crud_primary_business_keywords%'
      $componentsRequiringAttachmentIdentifierMigration: '%managing.crud_generated_attachment_migration_components%'
      $resourceScorer: '@App\Managing\Scorer\Admin\ManageCrudResourceScorer'

  App\Managing\Renderer\Admin\ManageGeneratedCrudControllerSourceRenderer:
    arguments:
      $resourcePolicy: '@App\Managing\Policy\Admin\ManageCrudResourcePolicy'

  App\Managing\Extractor\Admin\ManageGeneratedCrudControllerCustomizationExtractor: ~

  App\Managing\Writer\Admin\ManageGeneratedCrudControllerWriter:
    arguments:
      $bundleDir: '%managing.bundle_dir%'
      $resourcePolicy: '@App\Managing\Policy\Admin\ManageCrudResourcePolicy'
      $sourceRenderer: '@App\Managing\Renderer\Admin\ManageGeneratedCrudControllerSourceRenderer'
      $customizationExtractor: '@App\Managing\Extractor\Admin\ManageGeneratedCrudControllerCustomizationExtractor'

  App\Managing\Generator\Admin\ManageCrudControllerGenerator:
    arguments:
      $bundleDir: '%managing.bundle_dir%'
      $resourcePolicy: '@App\Managing\Policy\Admin\ManageCrudResourcePolicy'
      $writer: '@App\Managing\Writer\Admin\ManageGeneratedCrudControllerWriter'
      $nameFormatter: '@App\Managing\Formatter\Admin\Host\ManageClassNameFormatter'

  App\Managing\Reader\Admin\Host\ManageHostComposerAutoloadRootReader:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Managing\Resolver\Admin\Host\ManageHostPsr4RootResolver:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $namespacePrefixes: '%managing.host_scan_namespace_prefixes%'
      $excludedNamespaces: '%managing.host_scan_excluded_namespaces%'
      $autoloadRootReader: '@App\Managing\Reader\Admin\Host\ManageHostComposerAutoloadRootReader'

  App\Managing\Resolver\Admin\Host\ManageHostPathResolver:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $sourceRoots: '%managing.host_scan_source_roots%'
      $namespacePrefixes: '%managing.host_scan_namespace_prefixes%'
      $excludedNamespaces: '%managing.host_scan_excluded_namespaces%'
      $psr4RootResolver: '@App\Managing\Resolver\Admin\Host\ManageHostPsr4RootResolver'

  App\Managing\Resolver\Admin\Host\ManageHostClassNameResolver:
    arguments:
      $resourcePolicy: '@App\Managing\Policy\Admin\ManageCrudResourcePolicy'
      $formatter: '@App\Managing\Formatter\Admin\Host\ManageClassNameFormatter'
      $classNameExtractor: '@App\Managing\Extractor\Admin\Host\ManagePhpClassNameExtractor'

  App\Managing\Cache\Admin\Host\ManageHostCrudResourceCache:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $cacheDir: '%kernel.cache_dir%'

  App\Managing\Inspector\Admin\Host\ManageHostDoctrineEntityInspector:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $pathResolver: '@App\Managing\Resolver\Admin\Host\ManageHostPathResolver'

  App\Managing\Provider\Admin\Host\ManageHostApplicationAdminProvider:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $cacheDir: '%kernel.cache_dir%'
      $enabled: '%managing.host_scan_enabled%'
      $sourceRoots: '%managing.host_scan_source_roots%'
      $namespacePrefixes: '%managing.host_scan_namespace_prefixes%'
      $excludedNamespaces: '%managing.host_scan_excluded_namespaces%'
      $resourcePolicy: '@App\Managing\Policy\Admin\ManageCrudResourcePolicy'
    tags: ['manage.admin_provider']

  App\Managing\Registry\Admin\ManageAdminRegistry:
    arguments:
      $contributionFilter: '@App\Managing\Filter\Admin\ManageContributionFilter'

  App\Managing\Registry\Crud\ManageCrudResourceRegistry:
    arguments:
      $adminRegistry: '@App\Managing\Registry\Admin\ManageAdminRegistry'
      $contributionFilter: '@App\Managing\Filter\Admin\ManageContributionFilter'

  App\Managing\Builder\Admin\ManageAdminUserMenuBuilder:
    arguments:
      $logoutPath: '%managing.admin_logout_path%'
      $logoutLabel: '%managing.admin_logout_label%'

  App\Managing\RegistryInterface\Admin\ManageAdminRegistryInterface:
    alias: App\Managing\Registry\Admin\ManageAdminRegistry

  App\Managing\FilterInterface\Admin\ManageContributionFilterInterface:
    alias: App\Managing\Filter\Admin\ManageContributionFilter

  App\Managing\BuilderInterface\Admin\ManageAdminUserMenuBuilderInterface:
    alias: App\Managing\Builder\Admin\ManageAdminUserMenuBuilder

  App\Managing\RegistryInterface\Crud\ManageCrudResourceRegistryInterface:
    alias: App\Managing\Registry\Crud\ManageCrudResourceRegistry

  App\Managing\ServiceInterface\Administration\ManagingFieldAccessMutationReviewServiceInterface:
    alias: App\Managing\Service\Administration\ManagingFieldAccessMutationReviewService

  App\Managing\ServiceInterface\Administration\ManagingFieldAccessMutationApplyServiceInterface:
    alias: App\Managing\Service\Administration\ManagingFieldAccessMutationApplyService
  App\Managing\ServiceInterface\Administration\ManagingFieldViewProfileReviewServiceInterface:
    alias: App\Managing\Service\Administration\ManagingFieldViewProfileReviewService
  App\Managing\ServiceInterface\Administration\ManagingFieldViewProfileApplyServiceInterface:
    alias: App\Managing\Service\Administration\ManagingFieldViewProfileApplyService
  App\Managing\ServiceInterface\Administration\ManagingFieldVisibilityInspectionPrepareServiceInterface:
    alias: App\Managing\Service\Administration\ManagingFieldVisibilityInspectionPrepareService
  App\Managing\ValidatorInterface\Administration\ManagingFieldAccessPolicyDescriptorValidatorInterface:
    alias: App\Managing\Validator\Administration\ManagingFieldAccessPolicyDescriptorValidator

  App\Managing\FactoryInterface\Crud\ManageCrudFieldDefinitionFactoryInterface:
    alias: App\Managing\Factory\Crud\ManageCrudFieldDefinitionFactory

  App\Managing\FactoryInterface\Crud\ManageEasyAdminFieldFromDefinitionFactoryInterface:
    alias: App\Managing\Factory\Crud\ManageEasyAdminFieldFromDefinitionFactory

  App\Managing\ResolverInterface\Crud\ManageCrudFieldDefinitionTypeResolverInterface:
    alias: App\Managing\Resolver\Crud\ManageCrudFieldDefinitionTypeResolver

  App\Managing\InspectorInterface\Crud\ManageCrudFieldVisibilityInspectorInterface:
    alias: App\Managing\Inspector\Crud\ManageCrudFieldVisibilityInspector

  App\Managing\ResolverInterface\Crud\ManageCrudFieldExternalAccessResolverInterface:
    alias: App\Managing\Resolver\Crud\ManageCrudNullFieldExternalAccessResolver

  App\Managing\ResolverInterface\Crud\ManageCrudFieldUserProfileResolverInterface:
    alias: App\Managing\Resolver\Crud\ManageCrudConfiguredFieldUserProfileResolver


  App\Managing\ResolverInterface\Crud\ManageCrudFieldVisibilityExplanationResolverInterface:
    alias: App\Managing\Resolver\Crud\ManageCrudFieldVisibilityExplanationResolver

  App\Managing\ResolverInterface\Crud\ManageCrudFieldVisibilityResolverInterface:
    alias: App\Managing\Resolver\Crud\ManageCrudFieldVisibilityResolver

  App\Managing\RepositoryInterface\Crud\ManageCrudFieldViewProfileRuleRepositoryInterface:
    alias: App\Managing\Repository\Crud\ManageDoctrineCrudFieldViewProfileRuleRepository

  App\Managing\ReaderInterface\Crud\ManageCrudFieldUserProfileReaderInterface:
    alias: App\Managing\Reader\Crud\ManageCrudNullFieldUserProfileReader

  App\Managing\WriterInterface\Crud\ManageCrudFieldUserProfileWriterInterface:
    alias: App\Managing\Writer\Crud\ManageCrudNullFieldUserProfileWriter

  App\Managing\HandlerInterface\Crud\ManageCrudFieldUserProfileApplyHandlerInterface:
    alias: App\Managing\Handler\Crud\ManageCrudFieldUserProfileApplyHandler
