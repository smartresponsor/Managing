name: CMCP RC

on:
  push:
    branches:
      - cmcp/engine-20260911152412-managing-fed750

permissions:
  contents: write

jobs:
  rc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repositories with git
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/smartresponsor/Managing.git" Managing
          git clone --depth 1 https://github.com/smartresponsor/cruding.git Cruding
          git clone --depth 1 https://github.com/smartresponsor/interfacing.git Interfacing
          git clone --depth 1 https://github.com/smartresponsor/objecting.git Objecting
          git clone --depth 1 https://github.com/smartresponsor/viewing.git Viewing

      - name: Resolve dependency contour
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/Managing composer:2 \
            update cruding/crud interfacing/interface objecting/object viewing/view \
            --with-all-dependencies --no-interaction --prefer-dist

      - name: Validate Composer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/Managing composer:2 validate --strict

      - name: PHP 8.4 syntax
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/Managing php:8.4-cli sh -lc \
            "find src tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: PHPStan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php -v "$PWD:/work" -w /work/Managing composer:2 \
            vendor/bin/phpstan analyse src tests tools --memory-limit=1G

      - name: PHPUnit
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php -v "$PWD:/work" -w /work/Managing composer:2 \
            vendor/bin/phpunit -c phpunit.xml.dist

      - name: Commit generated lock
        shell: bash
        working-directory: Managing
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Synchronize platform dependency lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/smartresponsor/Managing.git" HEAD:"$GITHUB_REF_NAME"
